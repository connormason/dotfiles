---
services:
  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    # Ryzen 5 5600G iGPU, used for VA-API hardware transcoding (Dashboard > Playback > Transcoding)
    devices:
      - /dev/dri:/dev/dri
    # GID of the host's `render` group (getent group render), which owns /dev/dri/renderD128
    group_add:
      - "105"
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    volumes:
      - /storage/media/config/jellyfin:/config
      - /storage/media/tv:/tv
      - /storage/media/movies:/movies
      - /storage/media/music:/music
