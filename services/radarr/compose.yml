---
services:
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      # Served under /radarr (Tailscale route); set here so a wiped config comes back with it
      - RADARR__SERVER__URLBASE=/radarr
    volumes:
      - /storage/media/config/radarr:/config
      # One mount for libraries and downloads: imports are hardlinks, which fail across separate bind mounts (EXDEV)
      - /storage/media:/data
    ports:
      - "7878:7878"
