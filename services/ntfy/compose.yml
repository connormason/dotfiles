---
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      # Nothing is readable or writable without a token; create the admin user and publisher token once (services/README.md)
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
    volumes:
      - /storage/media/config/ntfy:/var/lib/ntfy
    ports:
      # Loopback only: host scripts (smartd, ZED, sanoid) publish to it, and Caddy reaches it by name on nas-network
      - "127.0.0.1:2586:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
