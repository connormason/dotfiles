- name: Infrastructure
  columns:
    - size: small
      widgets:
        # Reads the host's CPU, memory and temperature (/proc is not namespaced). Disk usage comes from the
        # mountpoints below, which must exist inside the container (see the volumes in compose.yml).
        - type: server-stats
          servers:
            - type: local
              name: NAS
              hide-mountpoints-by-default: true
              mountpoints:
                "/":
                  name: System
                  hide: false
                "/mnt/media":
                  name: Media
                  hide: false

    - size: full
      widgets:
        # `url` is the browser link (the .local names Caddy serves); `check-url` is what Glance requests from inside
        # the container, by container name on nas-network. Sonarr, Radarr and Prowlarr check the root, which either
        # serves the UI or redirects to the configured UrlBase.
        - type: monitor
          title: Services
          cache: 1m
          sites:
            - title: Plex
              url: http://plex.local
              check-url: http://plex:32400/identity
              icon: di:plex
            - title: Jellyfin
              url: http://jellyfin.local
              check-url: http://jellyfin:8096/health
              icon: di:jellyfin
            - title: Sonarr
              url: http://sonarr.local
              check-url: http://sonarr:8989
              icon: di:sonarr
            - title: Radarr
              url: http://radarr.local
              check-url: http://radarr:7878
              icon: di:radarr
            - title: Prowlarr
              url: http://prowlarr.local
              check-url: http://prowlarr:9696
              icon: di:prowlarr
            - title: Transmission
              url: http://transmission.local
              check-url: http://transmission:9091/transmission/web/
              icon: di:transmission
            - title: FlareSolverr
              url: http://flaresolverr:8191/health
              icon: di:flaresolverr
            - title: ntfy
              url: http://ntfy:80/v1/health
              icon: di:ntfy

        # Shows every container on the host, including stopped ones (no `running-only`), so a crashed service
        # appears as down instead of vanishing.
        - type: docker-containers
          title: Containers
