---
# ============================================================
# Docker installation
# ============================================================
- name: Install docker
  block:
    - name: Setup Docker repository
      block:
        - name: Install dependencies
          become: true
          ansible.builtin.apt:
            pkg:
              - ca-certificates
              - curl
              - gnupg

        - name: Add Docker GPG signing key
          become: true
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
            dest: /usr/share/keyrings/docker.asc
            mode: "0644"

        - name: Print debian architecture
          ansible.builtin.command: dpkg --print-architecture
          register: docker_dpkg_architecture
          changed_when: false
          check_mode: false

        # apt_repository refreshes the package index itself when it adds the repository
        - name: Add Docker repository
          become: true
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ docker_dpkg_architecture.stdout }} signed-by=/usr/share/keyrings/docker.asc]
              https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
              {{ ansible_facts['distribution_release'] }} stable
            state: present

    - name: Install Docker engine
      become: true
      ansible.builtin.apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    # The compose plugin (`docker compose`) is what deploy.sh and the services role use; v1 (`docker-compose`) is
    # deprecated and has no caller in this repository.
    - name: Remove the legacy docker-compose v1 package
      become: true
      ansible.builtin.apt:
        name: docker-compose
        state: absent

    # Written before the daemon starts, so a fresh install needs no restart. On a running host the change waits for a
    # restart: see docker_restart_on_config_change, which is off by default because a restart stops every container.
    - name: Configure the docker daemon
      become: true
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        validate: dockerd --validate --config-file %s
      notify: Restart docker

    - name: Ensure docker daemon is running
      become: true
      ansible.builtin.service:
        name: docker
        state: started

    - name: Install the weekly image prune service
      become: true
      ansible.builtin.template:
        src: docker-image-prune.service.j2
        dest: /etc/systemd/system/docker-image-prune.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for docker

    - name: Install the weekly image prune timer
      become: true
      ansible.builtin.template:
        src: docker-image-prune.timer.j2
        dest: /etc/systemd/system/docker-image-prune.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for docker

    # The new units must be loaded before the timer can be enabled
    - name: Reload systemd before enabling the prune timer
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the weekly image prune timer
      become: true
      ansible.builtin.systemd:
        name: docker-image-prune.timer
        state: started
        enabled: true

    # deploy.sh runs as this user; the group applies to new sessions, which is why the services role deploys through
    # become as the same user
    - name: Allow the SSH user to run docker without sudo
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: docker
        append: true

# ============================================================
# Directory and environment setup
# ============================================================
- name: Setup docker environment
  block:
    - name: Create docker directory structure
      ansible.builtin.file:
        path: "{{ docker_dir_path }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ docker_dir }}"
        - "{{ docker_dir }}/.build"
      loop_control:
        loop_var: docker_dir_path

    # PiHole re-owns this bind mount once it runs, so create the directory once and never enforce its mode or owner
    # afterwards (an enforced mode would report changed, or fail, on every run)
    - name: Check for the PiHole config directory
      ansible.builtin.stat:
        path: "{{ docker_dir }}/pihole-data/etc-pihole"
      register: docker_pihole_config_dir

    - name: Create the PiHole config directory
      ansible.builtin.file:
        path: "{{ docker_dir }}/pihole-data/etc-pihole"
        state: directory
        mode: "0755"
      when: not docker_pihole_config_dir.stat.exists

    # Shared, non-secret values only; per-service secrets are rendered by the services role. diff is off because a host
    # that predates the split still holds a password line in the old file, which --check --diff would print as removed
    - name: Render docker .env file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ docker_dir }}/.env"
        mode: "0600"
      diff: false
      tags:
        - configfile

# ============================================================
# Custom docker image builds
# ============================================================
- name: Setup autoplex
  block:
    - name: Clone autoplex repo
      ansible.builtin.git:
        repo: "{{ docker_autoplex_repo_url }}"
        dest: "{{ docker_autoplex_repo_dest }}"
        version: "{{ docker_autoplex_repo_branch }}"
        clone: true
        update: true
        accept_hostkey: true

    - name: Build autoplex docker image
      community.docker.docker_image:
        build:
          path: "{{ docker_autoplex_repo_dest }}"
        name: danielmmetz/autoplex
        tag: latest
        source: build
      become: true

# ============================================================
# Deploy script (the services role runs it)
# ============================================================
- name: Copy deploy script
  ansible.builtin.copy:
    src: deploy.sh
    dest: "{{ docker_dir }}/deploy.sh"
    mode: "0755"
  tags:
    - configfile
