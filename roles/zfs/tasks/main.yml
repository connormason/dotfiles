---
- name: Install zfs
  block:
    # Matches one-line sources ("deb … main contrib") and deb822 sources ("Components: main contrib")
    - name: Check for the contrib component in the apt sources
      ansible.builtin.command:
        argv:
          - grep
          - -rqsE
          - '^(deb(-src)?[[:space:]].*|Components:.*)[[:space:]]contrib([[:space:]]|$)'
          - /etc/apt/sources.list
          - /etc/apt/sources.list.d
      register: zfs_contrib_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install software-properties-common (provides apt-add-repository)
      become: true
      ansible.builtin.apt:
        name: software-properties-common
      when: zfs_contrib_check.rc != 0

    - name: Add the Debian contrib apt component
      become: true
      ansible.builtin.command:
        argv: [apt-add-repository, contrib, -y]
      register: zfs_contrib_added
      changed_when: true
      when: zfs_contrib_check.rc != 0

    - name: Update apt package index
      become: true
      ansible.builtin.apt:
        update_cache: true
      # Not `is changed`: ansible-lint no-handler flags it; the add task is changed_when: true, so this is equivalent
      when: zfs_contrib_added is not skipped

    - name: Read the Debian architecture
      ansible.builtin.command:
        argv: [dpkg, --print-architecture]
      register: zfs_dpkg_architecture
      changed_when: false
      check_mode: false

    - name: Install zfs dependencies
      become: true
      ansible.builtin.apt:
        pkg:
          - "linux-headers-{{ zfs_dpkg_architecture.stdout }}"
          - "linux-image-{{ zfs_dpkg_architecture.stdout }}"
          - dpkg-dev
          - zfs-dkms
          - zfsutils-linux
      when: not (ansible_check_mode and zfs_contrib_check.rc != 0)

# Pool properties and ZED edit state that a check-mode run on a fresh host cannot see (the zfs tools and zed.rc are not
# installed yet), so they are skipped there. The pool itself is created by hand, never by this role.
- name: Assert the pool exists and set its properties
  ansible.builtin.import_tasks: pool.yml
  when: not ansible_check_mode

- name: Route ZED notifications through nas-notify
  ansible.builtin.import_tasks: zed.yml
  when: not ansible_check_mode

- name: Snapshot the pool with sanoid
  ansible.builtin.import_tasks: sanoid.yml
