---
# prek/pre-commit configuration
# https://prek.j178.dev/configuration/

default_install_hook_types:
  - pre-commit
  - commit-msg
  - post-checkout
  - post-merge
  - post-rewrite
  - pre-push

exclude: ^archive/

repos:
  # ========================================================================================
  # Dependency syncing
  #
  #   - Priority 0     pyproject.toml          -> uv.lock
  #   - Priority 5     uv.lock                 -> .venv/
  #                    uv.lock                 -> requirements.txt
  #                    uv.lock                 -> .pre-commit-config.yaml (hook versions)
  #   - Priority 6    .pre-commit-config.yaml  -> .pre-commit-config.yaml (hook deps)
  #
  # ========================================================================================

  - repo: local
    hooks:

      # Ensure uv.lock is up-to-date. Runs through uv-public.sh, so a lock polluted by a plain `uv run` from a work
      # environment is rewritten back to public PyPI whenever uv.lock is staged
      # pyproject.toml -> uv.lock
      - id: uv-lock
        name: "[sync]   dependencies (pyproject.toml -> uv.lock)"
        groups: [sync, local, uv]
        stages: [pre-commit, manual]
        priority: 0
        entry: scripts/hooks/uv-public.sh lock --refresh
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false

      # Sync .venv/ with uv.lock on checkout/pull/rebase
      # uv.lock -> .venv/
      - id: uv-sync
        name: "[sync]   dependencies (uv.lock -> .venv)"
        groups: [sync, local, uv]
        stages: [post-checkout, post-merge, post-rewrite]
        priority: 5
        entry: scripts/hooks/uv-public.sh sync --no-active --locked
        language: system
        always_run: true
        pass_filenames: false

      # Export locked package requirements to requirements.txt
      # uv.lock -> requirements.txt
      - id: uv-export
        name: "[sync]   dependencies (uv.lock -> requirements.txt)"
        groups: [sync, local, uv, requirements]
        stages: [pre-commit, manual]
        priority: 5
        entry: scripts/hooks/uv-public.sh export
        language: system
        files: ^uv\.lock$
        pass_filenames: false
        args:
          - "--format=requirements.txt"
          - "--output-file=requirements.txt"
          - "--frozen"
          - "--no-hashes"
          - "--no-header"

  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.5.0
    hooks:

      # Sync pre-commit hook versions with uv.lock versions
      # uv.lock -> .pre-commit-config.yaml
      - id: sync-with-uv
        name: "[sync]   dependencies (uv.lock -> .pre-commit-config.yaml)"
        groups: [sync, local, uv, requirements]
        stages: [pre-commit, manual]
        priority: 5

  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.4
    hooks:

      # Sync pre-commit hook dependencies based on other installed hooks
      # .pre-commit-config.yaml -> .pre-commit-config.yaml
      - id: sync-pre-commit-deps
        name: "[sync]   dependencies (.pre-commit-config.yaml -> .pre-commit-config.yaml)"
        groups: [sync, local, uv, requirements]
        stages: [pre-commit, manual]
        priority: 6

  # ========================================================================================
  # Read-only checks
  #
  # Priority 10 (run in parallel)
  # ========================================================================================

  - repo: builtin
    hooks:

      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict
        name: "[check]  filename casing"
        groups: [check, local, ci]
        stages: [pre-commit, manual]
        priority: 10

      # Check for broken symlinks
      - id: check-symlinks
        name: "[check]  symlinks"
        groups: [check, local, ci, symlink]
        stages: [pre-commit, manual]
        priority: 10

      # Detect destroyed symlinks
      - id: destroyed-symlinks
        name: "[check]  destroyed symlinks"
        groups: [check, local, ci, symlink]
        stages: [pre-commit, manual]
        priority: 10

      # Ensures that (non-binary) files with a shebang are executable
      - id: check-shebang-scripts-are-executable
        name: "[check]  files with shebangs are executable"
        groups: [check, local, ci, executable]
        stages: [pre-commit, manual]
        priority: 10
        exclude: \.j2$            # Jinja templates carry a shebang but are rendered, not executed

      # Ensures that (non-binary) executables have a shebang
      - id: check-executables-have-shebangs
        name: "[check]  executable files have shebangs"
        groups: [check, local, ci, executable]
        stages: [pre-commit, manual]
        priority: 10

      # Prevent committing large files
      - id: check-added-large-files
        name: "[check]  large files"
        groups: [check, local, ci, git]
        stages: [pre-commit, manual]
        priority: 10
        exclude: |
          (?x)(
              ^uv\.lock|
              ^.*\.md
          )

      # Check for merge conflicts (git merge strings in files)
      - id: check-merge-conflict
        name: "[check]  merge conflicts"
        groups: [check, local, ci, git]
        stages: [pre-commit, manual]
        priority: 10

      # Prevent addition of new submodules
      - id: forbid-new-submodules
        name: "[check]  no broke boys, no new submodules"
        groups: [check, local, ci, git]
        stages: [pre-commit, manual]
        priority: 10

      # Check that VCS links are permalinks
      - id: check-vcs-permalinks
        name: "[check]  vcs permalinks"
        groups: [check, local, ci, docs]
        stages: [pre-commit, manual]
        priority: 10
        types_or: [markdown, rst]

      # Detect private keys
      - id: detect-private-key
        name: "[check]  private keys"
        groups: [check, local, ci, secrets]
        stages: [pre-commit, manual]
        priority: 10

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:

      # Scan staged content for high-entropy strings / credential patterns.
      # After auditing new findings, refresh the baseline:
      #   uvx detect-secrets scan --baseline .secrets.baseline && uvx detect-secrets audit .secrets.baseline
      - id: detect-secrets
        name: "[check]  secrets"
        groups: [check, local, ci, secrets]
        stages: [pre-commit, manual]
        priority: 10
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)(
              ^uv\.lock$|
              ^\.secrets\.baseline$
          )

  - repo: builtin
    hooks:

      # Validate TOML file syntax
      - id: check-toml
        name: "[check]  toml syntax"
        groups: [check, local, ci, toml]
        stages: [pre-commit, manual]
        priority: 10

      # Validate XML file syntax
      - id: check-xml
        name: "[check]  xml syntax"
        groups: [check, local, ci, xml, plist]
        stages: [pre-commit, manual]
        priority: 10

      # Validate YAML file syntax
      - id: check-yaml
        name: "[check]  yaml syntax"
        groups: [check, local, ci, yaml]
        stages: [pre-commit, manual]
        priority: 10
        exclude: ^services/homeassistant/config/            # Doesn't like !include/!secret macros

      # Validate JSON file syntax
      - id: check-json
        name: "[check]  json syntax"
        groups: [check, local, ci, json]
        stages: [pre-commit, manual]
        priority: 10
        exclude: ^stow/zed/.*\.json$                # JSONC (comments, trailing commas); checked by json5 hook

  - repo: local
    hooks:

      # Validate JSON5 file syntax (PEP 723 script; pyjson5 resolved at runtime)
      - id: check-json5
        name: "[check]  json5 syntax"
        groups: [check, local, ci, json, json5]
        stages: [pre-commit, manual]
        priority: 10
        entry: scripts/hooks/check-json5.py
        language: python
        files: .*\.json5$|^stow/zed/.*\.json$

      # Validate Pkl file syntax via `pkl eval` (no-op if `pkl` is not installed)
      - id: check-pkl
        name: "[check]  pkl syntax"
        groups: [check, local, ci, pkl]
        stages: [pre-commit, manual]
        priority: 10
        entry: scripts/hooks/check-pkl.py
        language: python
        files: .*\.pkl$
        types: [file]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:

      # Validate pyproject.toml
      - id: validate-pyproject
        name: "[check]  pyproject.toml syntax/schema"
        groups: [check, local, ci, pyproject, toml]
        stages: [pre-commit, manual]
        priority: 10
        args: ["--disable-plugins", "hatch"]
        additional_dependencies:
          - validate-pyproject[all]
          - validate-pyproject-schema-store

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      # Verify python source files parse as valid python
      - id: check-ast
        name: "[check]  python ast"
        groups: [check, local, ci, python]
        stages: [pre-commit, manual]
        priority: 10

      # Check for debugger imports and py37+ ``breakpoint()`` calls in python source files
      - id: debug-statements
        name: "[check]  python debug statements"
        groups: [check, local, ci, python]
        stages: [pre-commit, manual]
        priority: 10

      # Verify python unit test filenames match pytest expectations
      - id: name-tests-test
        name: "[check]  python unit test filenames"
        groups: [check, local, ci, python]
        stages: [pre-commit, manual]
        priority: 10
        args: [--pytest-test-first]
        exclude: ^tests/golden\.py$

  - repo: local
    hooks:

      # Block employer-internal identifiers in staged content/paths and in the commit identity
      # (public baseline + optional private patterns from ~/.config/dotfiles/leak-patterns.txt).
      # CI scans the full tree separately
      - id: check-leaks
        name: "[check]  internal identifiers in file content/paths"
        groups: [check, local, ci, leaks]
        stages: [pre-commit]
        priority: 10
        entry: scripts/hooks/check-leaks.py --identity
        language: python
        types: [text]
        always_run: true

      # Same scan applied to the commit message (prek passes the message file as the filename).
      # Identity is already checked by the pre-commit entry above
      - id: check-leaks-msg
        name: "[check]  internal identifiers in commit message"
        groups: [check, local, leaks]
        stages: [commit-msg]
        entry: scripts/hooks/check-leaks.py
        language: python

      # [pre-push] Scan file contents changed in the pushed range
      #            (catches content committed with --no-verify)
      - id: check-leaks-push-files
        name: "[check]  internal identifiers in pushed files"
        groups: [check, local, leaks]
        stages: [pre-push]
        priority: 10
        entry: scripts/hooks/check-leaks.py
        language: python
        types: [text]

      # [pre-push] Scan identities, messages, and added lines of pushed commits
      #            (cherry-picks/rebases skip commit hooks)
      - id: check-leaks-push-history
        name: "[check]  internal identifiers in pushed commits"
        groups: [check, local, leaks]
        stages: [pre-push]
        priority: 10
        entry: scripts/hooks/check-leaks-push.sh
        language: system
        pass_filenames: false
        always_run: true

  # ========================================================================================
  # Text/whitespace fixers
  #
  # Priority 20 - 23 (run sequentially, all may modify any text file)
  # ========================================================================================

  - repo: builtin
    hooks:

      # Removes UTF-8 byte order marker
      - id: fix-byte-order-marker
        name: "[fix]    utf-8 byte order marker"
        groups: [fix, local]
        stages: [pre-commit]
        priority: 20

      # Ensures files end in a single newline
      - id: end-of-file-fixer
        name: "[fix]    end-of-file"
        groups: [fix, local, whitespace]
        stages: [pre-commit]
        priority: 21

      # Replaces mixed line ending
      - id: mixed-line-ending
        name: "[fix]    mixed line ending"
        groups: [fix, local, whitespace]
        stages: [pre-commit]
        priority: 22
        exclude: ^\.gitignore

      # Trims trailing whitespace from files
      - id: trailing-whitespace
        name: "[fix]    trailing whitespace"
        groups: [fix, local, whitespace]
        stages: [pre-commit]
        priority: 23
        exclude: |
          (?x)(
              ^.gitignore|
              .config/istat_menus.ismp|
              .*\.md
          )

  # ========================================================================================
  # Formatters/fixers
  #
  #   - Priority 30    any file type                  codespell --write-changes
  #   - Priority 31    any file type                  keep-sorted
  #   - Priority 35    shell scripts                  shfmt
  #                    json (.claude)                 pretty-format-json
  #                    json (vscode keybindings)      sort-json-array
  #                    toml                           taplo
  #                    pkl                            format-pkl
  #                    markdown                       mdformat
  #                    python                         ruff --fix-only
  #
  # ========================================================================================

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:

      # Fix common misspellings in text files
      - id: codespell
        name: "[fix]    spelling mistakes (codespell --write-changes)"
        groups: [fix, local, spelling, codespell]
        stages: [pre-commit]
        priority: 30
        pass_filenames: false
        args: [--write-changes]
        additional_dependencies:
          - tomli

  - repo: https://github.com/google/keep-sorted
    rev: v0.9.1
    hooks:

      # Language-agnostic auto-sorting between two markers
      - id: keep-sorted
        name: "[format] sorting (keep-sorted)"
        groups: [format, local, sort]
        stages: [pre-commit]
        priority: 31

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:

      # Shell script auto-formatting
      - id: shfmt
        name: "[format] shell scripts (shfmt)"
        groups: [format, local, shell]
        stages: [pre-commit]
        priority: 35
        # zsh dotfiles are not POSIX/bash; shfmt mangles them (zsh syntax it does not understand)
        exclude: |
          (?x)^(
              stow/[^/]+/\.(zshrc|zprofile|zshenv|zlogin)|
              stow/[^/]+/\.config/zsh/.*\.zsh|
              stow/os_tools/\.config/ranger/scope\.sh|
              ^stow/shell/.profile
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:

      # Format Claude Code settings JSON files
      - id: pretty-format-json
        name: "[format] json - claude settings"
        groups: [format, local, json, claude]
        stages: [pre-commit]
        priority: 35
        types: [text]
        files: ^\.claude/settings.*\.json$
        args:
          - "--no-ensure-ascii"
          - "--indent=2"
          - "--autofix"
          - "--top-keys=id,name,type,matcher,mode,command"

  - repo: local
    hooks:

      # Sort the VS Code keybindings array by `command`; rewrites the file, so pre-commit only (not run in CI)
      - id: sort-json-array
        name: "[format] json - vscode keybindings sort"
        groups: [format, local, sort, json, vscode]
        stages: [pre-commit]
        priority: 35
        entry: scripts/hooks/sort-json-array.py
        language: python
        args: [--key, command]
        files: ^stow/vscode/Library/Application Support/Code/User/keybindings\.json$

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:

      # TOML file auto-formatting
      - id: taplo-format
        name: "[format] toml (taplo)"
        groups: [format, local, toml, taplo]
        stages: [pre-commit]
        priority: 35

  - repo: local
    hooks:

      # Pkl file auto-formatting (no-op if `pkl` is not installed); not run in CI
      - id: format-pkl
        name: "[format] pkl (pkl format)"
        groups: [format, local, pkl]
        stages: [pre-commit]
        priority: 35
        entry: scripts/hooks/format-pkl.py
        language: python
        files: .*\.pkl$
        types: [file]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:

      # Markdown file auto-formatting
      - id: mdformat
        name: "[format] markdown (mdformat)"
        groups: [format, local, markdown]
        stages: [pre-commit]
        priority: 35
        additional_dependencies:
          - mdformat-config
          - mdformat-footnote
          - mdformat-front-matters
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-pyproject
          - mdformat-simple-breaks
          - mdformat-toc
        exclude: |
          (?x)^(
            ^.ctx/.*|
            ^docs/plans/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:

      # Python lint auto-fixes
      - id: ruff
        name: "[fix]    python lint (ruff check --fix-only)"
        groups: [fix, local, python, ruff]
        stages: [pre-commit]
        priority: 35
        args: [--fix-only, --exit-non-zero-on-fix]

  # ========================================================================================
  # Linters
  #
  # Priority 40 (run in parallel)
  # ========================================================================================

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:

      # Python lint check (must happen after --fix-only stage above)
      # Check/lint and output errors as junit if running in CI
      - id: ruff
        name: "[lint]   python lint (ruff check) - junit output"
        groups: [lint, ci, python, ruff]
        stages: [manual]
        priority: 40
        args: [--output-format, junit, --output-file, .reports/ruff.xml]

      # Python lint check (must happen after --fix-only stage above)
      # Always check/lint (local or CI), output errors to stdout
      - id: ruff
        name: "[lint]   python lint (ruff check)"
        groups: [lint, local, ci, python, ruff]
        stages: [pre-commit, manual]
        priority: 40

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:

      # Python static type checking
      - id: mypy
        name: "[lint]   python typing (mypy)"
        groups: [lint, local, ci, python, types, mypy]
        stages: [pre-commit, manual]
        priority: 40
        args: [--config-file, pyproject.toml, --junit-xml, .reports/mypy.xml]
        additional_dependencies:
          - "--index-url=https://pypi.org/simple"
          - types-PyYAML
          - types-requests
          - types-toml
        exclude: |
          (?x)(
              ^services/homeassistant/config/|
              ^stow/os_tools/\.config/ranger/commands\.py$
          )

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:

      # Check python code docstring coverage
      - id: interrogate
        name: "[check]  python docstring coverage (interrogate)"
        groups: [check, local, ci, docs, python, interrogate]
        stages: [pre-commit, manual]
        priority: 40
        pass_filenames: false
        args: [--config, pyproject.toml]
        # NOTE: The exclude list is only considered when `interrogate` is run with pre-commit (prek) hooks.
        #       Excluded files must be duplicated ``tool.interrogate.exclude`` entry of pyproject.toml
        #       if `interrogate` is run outside of pre-commmit/prek.
        exclude: |
          (?x)(
              ^\.cicd/|
              ^\.claude/|
              ^\.nox/|
              ^\.tmp/|
              ^\.worktrees/|
              ^archive/|
              ^build/|
              ^docs/|
              ^run\.py$|
              ^tests/
          )

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:

      # Linting for shell scripts
      - id: shellcheck
        name: "[lint]   shell scripts (shellcheck)"
        groups: [lint, local, ci, shell]
        stages: [pre-commit, manual]
        priority: 40
        # shellcheck does not support zsh: *.zsh files (e.g. stow/shell/.config/zsh/conf.d/*.zsh) and stowed zsh dotfiles
        exclude: |
          (?x)(
              \.zsh$|
              ^stow/[^/]+/\.(zshrc|zprofile|zshenv|zlogin)$|
              ^stow/os_tools/\.config/ranger/scope\.sh$|
              ^stow/shell/.profile
          )

#  - repo: https://github.com/DavidAnson/markdownlint-cli2
#    rev: v0.22.0
#    hooks:
#
#      # Markdown linting
#      - id: markdownlint-cli2
#        name: "[lint]   markdown (markdownlint)"
#        groups: [lint, local, ci, markdown]
#        stages: [pre-commit, manual]
#        priority: 40
#
