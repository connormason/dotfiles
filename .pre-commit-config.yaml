#      - id: taplo-lint
#        name: "[lint]   toml"
#        groups: [lint, local, ci, toml, taplo]
#        stages: [pre-commit, manual]
#        priority: 40
#        exclude: ^archive

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:

      # YAML linting
      - id: yamllint
        name: "[lint]   yaml (yamllint)"
        groups: [lint, local, ci, yaml]
        stages: [pre-commit, manual]
        priority: 40

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:

      # Check for common misspellings in text files
      # Only run in CI. When hooks are run locally, we auto-fix misspellings with ``codespell --write-changes`` (above)
      - id: codespell
        name: "[check]  spelling mistakes (codespell)"
        groups: [check, ci, spelling, codespell]
        stages: [manual]
        priority: 40
        pass_filenames: false
        additional_dependencies:
          - tomli

  - repo: local
    hooks:

      # Ansible linting of playbooks/ and roles/ (check only; the wrapper supplies a throwaway vault password)
      - id: ansible-lint
        name: "[lint]   ansible roles/playbooks (ansible-lint)"
        groups: [lint, local, ci, yaml, ansible]
        stages: [pre-commit, manual]
        priority: 40
        entry: scripts/hooks/ansible-lint.sh
        language: script
        files: ^(playbooks|roles)/|^\.ansible-lint|^\.yamllint
        pass_filenames: false
