---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --group lint
      - name: Ruff check
        run: uv run ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          uv sync --group lint
          uv pip install types-PyYAML types-requests
      - name: Mypy
        run: uv run mypy .

  interrogate:
    name: interrogate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --group lint
      - name: Check docstring coverage
        run: uv run interrogate

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run yamllint
        run: uvx yamllint .

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r roles/requirements.yml
      - name: ansible-lint
        run: scripts/hooks/ansible-lint.sh

  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run codespell
        run: uvx codespell

  pytest:
    name: pytest (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install GNU Stow
        run: brew install stow
      - name: Install dependencies
        run: uv sync --group test
      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r roles/requirements.yml
      - name: Pytest
        run: uv run pytest
      - name: Bootstrap dry run (throwaway HOME)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" bash bootstrap/bootstrap.sh --dry-run --no-log | tee "$RUNNER_TEMP/dry.log"
          tail -n1 "$RUNNER_TEMP/dry.log" | grep -Eqx 'bootstrap: changes=[0-9]+'

  pytest-linux:
    name: pytest (Linux)
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Put Linuxbrew on PATH
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew || { echo "::error::no Linuxbrew on this runner image"; exit 1; }
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install GNU Stow (Linuxbrew) and zsh (apt)
        run: |
          brew install stow
          sudo apt-get update && sudo apt-get install -y zsh
      - name: Tap the Brewfile's taps
        run: brew bundle list --tap --file bootstrap/Brewfile | xargs -n1 brew tap
      - name: Install dependencies
        run: uv sync --group test
      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r roles/requirements.yml
      - name: Pytest
        run: uv run pytest
      - name: Bootstrap dry run (throwaway HOME)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" bash bootstrap/bootstrap.sh --dry-run --no-log | tee "$RUNNER_TEMP/dry.log"
          tail -n1 "$RUNNER_TEMP/dry.log" | grep -Eqx 'bootstrap: changes=[0-9]+'
